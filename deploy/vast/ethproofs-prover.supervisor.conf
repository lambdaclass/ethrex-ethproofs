; supervisor unit for the ethrex-ethproofs dual prover on vast.ai instances.
; Install: cp to /etc/supervisor/conf.d/ethproofs-prover.conf && supervisorctl reread && supervisorctl update
; Ops:     supervisorctl status|restart|stop ethproofs-prover ; supervisorctl tail -f ethproofs-prover
[program:ethproofs-prover]
command=/root/ethrex-ethproofs/deploy/vast/relaunch-dual-prover.sh
directory=/root/ethrex-ethproofs
autostart=true
autorestart=true
startsecs=15
startretries=999999
stopasgroup=true
killasgroup=true
stopwaitsecs=30
environment=HOME="/root",USER="root"
stdout_logfile=/root/ethrex-ethproofs/prover-service.log
stdout_logfile_maxbytes=200MB
stdout_logfile_backups=2
redirect_stderr=true
